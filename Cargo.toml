[package]
name = "clipper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "utils", "voice"] }
tokio = { version = "1.32.0", features = ["full"] }
songbird = { version = "0.6.1", features = ["receive"] }
tracing-subscriber = "0.3.11"
hound = "3.5.1"
libloading = "0.8"
# enables decoding of custom TRIGGER_SOUND files in songbird
symphonia = { version = "0.5", features = ["wav", "pcm", "mp3", "ogg", "vorbis"] }
warp = "0.3.5"
